; Optional. Copy next to the game's exe, together with dinput8.dll, only to turn a part off.
; Without this file, everything is on. 1 = on, 0 = off.
[proxy]
; Fake WMI for the game's "is this an Xbox pad?" check (removes the long freezes).
WmiShortcut=1
; Remembered DirectInput device lists (removes the remaining ~0.5 s hitches).
EnumCache=1
